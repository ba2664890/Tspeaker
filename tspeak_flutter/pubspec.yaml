name: tspeak
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  go_router: ^12.1.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  record: ^5.0.4
  audioplayers: ^5.2.1
  confetti: ^0.7.0
  smooth_page_indicator: ^1.1.0
  dio: ^5.4.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

dependency_overrides:
  record_linux: ^1.2.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/

